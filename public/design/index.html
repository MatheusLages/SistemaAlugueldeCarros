<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lages Cars — Design System</title>
<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.bsTheme=localStorage.getItem('lages-design-theme')||'light'}catch{document.documentElement.dataset.bsTheme='light'}</script>
<style>body{margin:0;font:14px system-ui,sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700}.brand{display:flex;text-decoration:none}.btn{border-radius:9px;font-size:13px;font-weight:600;padding:11px 17px}.btn-primary{background:#125bfa;border-color:#125bfa;color:white}.badge-status{display:inline-block;padding:7px 10px;border-radius:6px;font-size:12px;background:#edf3ff;color:#245dc4}.badge-status.aprovado{background:#125bfa;color:white}.badge-status.recusado{background:#e4e8ef;color:#43516a}.form-label{font-weight:600;font-size:12px}.form-control{padding:11px 13px}/* IDENTIDADE VISUAL, PÁGINA /DESIGN E TEMAS */
:root{--surface:#ffffff;--canvas:#f5f7fb;--ink:#10131b;--muted:#687386;--line:#e0e6ef;--blue:#125bfa}
[data-bs-theme=dark]{--surface:#151d2c;--canvas:#0b111c;--ink:#eef3fc;--muted:#a9b7cc;--line:#2b3950;--blue:#79a6ff;--bs-body-bg:#151d2c;--bs-body-color:#eef3fc;--bs-border-color:#2b3950;color-scheme:dark}
body{background:var(--canvas);color:var(--ink)}h1,h2,h3,h4,.brand{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700}h1{font-size:36px}h2{font-size:25px}
.brand img{width:168px;height:72px;object-fit:contain;background:#000;border-radius:9px;padding:6px;display:block}.sidebar .brand{padding:0 0 26px}.mobile-brand .brand img{width:112px;height:46px}.auth-story .brand img{width:185px;height:81px}
.site-tools{position:fixed;bottom:18px;right:18px;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);padding:8px;border-radius:12px;box-shadow:0 4px 20px #0002;z-index:45}.site-tools a,.site-tools button{font:600 12px system-ui;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:9px 12px;border-radius:7px;text-decoration:none}
.design-wrap{max-width:1100px;margin:auto;padding:38px 24px 100px}.design-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.design-intro{max-width:720px;margin-bottom:35px}.design-intro h1{font-size:58px;line-height:1.03;margin:14px 0}.design-intro p{font-size:16px;color:var(--muted);line-height:1.8}.design-section{padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:22px 0}.design-section h2{margin-bottom:22px}.design-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.design-swatch{height:95px;border-radius:9px;display:flex;align-items:flex-end;padding:13px;border:1px solid #71809c66;font-weight:600}.design-label{font-size:12px;color:var(--muted);margin-top:8px}.logo-stage{padding:30px;background:#000;border-radius:12px;text-align:center}.logo-stage img{width:min(500px,100%);height:auto}.type-sample{font-family:Rajdhani,system-ui,sans-serif;font-size:40px;font-weight:700}.design-demo{padding:22px;border:1px solid var(--line);border-radius:10px}.theme-previews{display:grid;grid-template-columns:1fr 1fr;gap:20px}.theme-preview{padding:24px;border-radius:12px;border:1px solid #74839a55}.theme-preview.light{background:#f5f7fb;color:#10131b}.theme-preview.dark{background:#0b111c;color:#eef3fc}.theme-preview img{width:100%;height:140px;object-fit:contain;border-radius:8px;margin:12px 0}.design-section p,.design-section li{line-height:1.8}.design-section code{color:var(--blue)}
[data-bs-theme=dark] .sidebar,[data-bs-theme=dark] .topbar,[data-bs-theme=dark] .panel,[data-bs-theme=dark] .stat,[data-bs-theme=dark] .car-card,[data-bs-theme=dark] .auth-form,[data-bs-theme=dark] .contract-paper,[data-bs-theme=dark] dialog{background:var(--surface);color:var(--ink);border-color:var(--line)}
[data-bs-theme=dark] .auth{background:var(--surface)}[data-bs-theme=dark] .support-box,[data-bs-theme=dark] .demo-info,[data-bs-theme=dark] .auth-tabs,[data-bs-theme=dark] .car-stage{background:#101827;border-color:var(--line)}
[data-bs-theme=dark] .side-nav a{color:#b6c4d8}[data-bs-theme=dark] .side-nav a.active,[data-bs-theme=dark] .side-nav a:hover{background:#203351;color:#a8c5ff}[data-bs-theme=dark] .auth-tabs button.active{background:#2b3d57;color:white}
[data-bs-theme=dark] .table{--bs-table-bg:var(--surface);--bs-table-color:var(--ink);--bs-table-border-color:var(--line)}[data-bs-theme=dark] .table th{background:#101827;color:#b3c2d7}[data-bs-theme=dark] .table td,[data-bs-theme=dark] .table td b{color:var(--ink)}
[data-bs-theme=dark] .form-control,[data-bs-theme=dark] .form-select{background-color:#0e1726;color:var(--ink);border-color:#3d4e68}[data-bs-theme=dark] .form-control::placeholder{color:#91a1b8}[data-bs-theme=dark] .btn-light,[data-bs-theme=dark] .btn-outline-dark{background:#23334a;color:white;border-color:#40546f}[data-bs-theme=dark] .btn-primary{background:#125bfa;color:white}[data-bs-theme=dark] .muted,[data-bs-theme=dark] .form-text{color:var(--muted)}[data-bs-theme=dark] .badge-status.cancelado,[data-bs-theme=dark] .badge-status.recusado{background:#34435a;color:#e2eafa}
@media(max-width:650px){.design-grid,.theme-previews{grid-template-columns:1fr}.design-intro h1{font-size:42px}.design-section{padding:20px}.design-nav{gap:14px}.design-nav .brand img{width:140px;height:63px}.site-tools{bottom:10px;right:10px}.auth-form{padding-bottom:95px}}
@media print{.site-tools{display:none}}

</style></head><body><div id="app"></div><div class="site-tools"><a href="/">Voltar ao sistema</a><button id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro">Alternar tema</button></div><script type="module">const root=document.getElementById('app');
const brand=()=>'<a class="brand" href="/" aria-label="Lages Cars — início"><img src="/design/logo.svg" alt="Logo Lages Cars"></a>';
const statusNames={em_analise:'Em análise',aprovado:'Aprovado',recusado:'Recusado'};
const status=p=>`<span class="badge-status ${p.status}">${statusNames[p.status]}</span>`;
function themeLabel() {
 const dark = document.documentElement.dataset.bsTheme === 'dark';
 const button = document.getElementById('theme-toggle');
 button.textContent = dark ? '☀ Tema claro' : '☾ Tema escuro';
 button.setAttribute('aria-pressed', String(dark));
}
document.getElementById('theme-toggle').addEventListener('click', () => {
 const theme = document.documentElement.dataset.bsTheme === 'dark' ? 'light' : 'dark';
 document.documentElement.dataset.bsTheme = theme;
 try { localStorage.setItem('lages-design-theme', theme); } catch {}
 themeLabel();
});
themeLabel();
function designPage() {
 root.innerHTML = `<main class="design-wrap" id="main"><nav class="design-nav">${brand()}<a href="/" class="btn btn-primary">Acessar o sistema →</a></nav><header class="design-intro"><span class="eyebrow muted">LAGES CARS · DESIGN SYSTEM · LAB02</span><h1>Identidade em cada detalhe.</h1><p>Uma referência visual para construir e manter as telas do sistema de aluguel de carros. Marca, cores, tipografia, componentes e temas reunidos em um só lugar.</p></header>
 <section class="design-section"><h2>01 · Marca</h2><div class="logo-stage"><img src="/design/logo.svg" alt="Logo branca Lages Cars com perfil de automóvel inspirado no Porsche 911"></div><p class="design-label">Logo monocromática branca com fundo transparente, apresentada sobre uma superfície preta. Referência: perfil do Porsche 911. Use o arquivo sem deformar, preserve as margens e aplique sobre superfície escura para manter contraste.</p><a class="btn btn-light" href="/design/logo.svg" download="LagesCars-logo.svg">Baixar logo sem fundo (SVG)</a></section>
 <section class="design-section"><h2>02 · Paleta cromática</h2><div class="design-grid">${[['Azul principal','#125BFA','white'],['Preto profundo','#0B111C','white'],['Branco','#FFFFFF','#10131b'],['Superfície clara','#F5F7FB','#10131b'],['Superfície escura','#151D2C','white'],['Azul acessível no escuro','#79A6FF','#10131b']].map(([label,color,text])=>`<div><div class="design-swatch" style="background:${color};color:${text}">${color}</div><div class="design-label">${label}</div></div>`).join('')}</div><p class="design-label">Azul identifica ações. Preto e branco sustentam a identidade. No tema escuro, os links usam azul mais claro para leitura.</p></section>
 <section class="design-section"><h2>03 · Tipografia automotiva</h2><p><b>Rajdhani</b> nos títulos: letras de desenho técnico e proporções compactas, associadas a painéis e instrumentos automotivos. Texto de leitura e formulários usam fontes do sistema para legibilidade.</p><div class="type-sample">LAGES CARS — seu próximo destino.</div><div style="font:600 28px Rajdhani,system-ui">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789</div><p class="design-label">Títulos: peso 700. Texto: 14–16 px. Rótulos: 12 px. A fonte é carregada pelo Google Fonts, com alternativa do sistema se não houver conexão.</p><a href="https://fonts.google.com/specimen/Rajdhani" target="_blank" rel="noopener noreferrer">Fonte Rajdhani · Google Fonts</a></section>
 <section class="design-section"><h2>04 · Componentes e estados</h2><div class="design-grid"><div class="design-demo"><h3>Botões</h3><button class="btn btn-primary mb-2" type="button">Solicitar aluguel</button><br><button class="btn btn-light" disabled>Indisponível</button></div><div class="design-demo"><h3>Formulários</h3><label class="form-label" for="design-name">Nome do cliente</label><input id="design-name" class="form-control" value="Matheus"><small class="form-text">Rótulos claros e foco visível.</small></div><div class="design-demo"><h3>Status dos pedidos</h3><p>${status({status:'em_analise'})}</p><p>${status({status:'aprovado'})}</p><p>${status({status:'recusado'})}</p></div></div></section>
 <section class="design-section"><h2>05 · Temas light e dark</h2><p>Use o controle no canto da página para alternar o tema desta página de design. A preferência fica salva neste navegador e é restaurada ao voltar.</p><div class="theme-previews"><article class="theme-preview light"><span class="eyebrow">LIGHT</span><h3>Encontre seu próximo carro.</h3><img src="/imagens/polo.jpg" alt="Volkswagen Polo Track no exemplo claro"><p>Superfícies claras e ação azul.</p><span class="btn btn-primary">Escolher veículo</span></article><article class="theme-preview dark"><span class="eyebrow">DARK</span><h3>Encontre seu próximo carro.</h3><img src="/imagens/renegade.jpg" alt="Jeep Renegade no exemplo escuro"><p>Superfícies escuras e texto claro.</p><span class="btn btn-primary">Escolher veículo</span></article></div></section>
 <section class="design-section"><h2>06 · Uso e consistência</h2><ul><li>Espaçamento em múltiplos de 4 px; cartões com cantos de 12–14 px.</li><li>Campos com rótulos, foco visível e mensagens de erro próximas ao formulário.</li><li>Layout responsivo: três colunas no desktop e uma coluna no celular.</li><li>Fotografias reais com créditos disponíveis no sistema.</li></ul><p class="design-label">Referências indicadas em aula: <a href="https://lab-carflow.vercel.app/design" target="_blank" rel="noopener noreferrer">CarFlow /design</a> e <a href="https://aramuni.dev/?cmd=ds" target="_blank" rel="noopener noreferrer">Aramuni Design System</a>.</p></section></main>`;
}


designPage();</script></body></html>
